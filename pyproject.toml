[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "humanized-hash"
dynamic = ["version"]
description = "Humanized Hash (hh): an address, a public key or a hash as a small deterministic picture that a person can compare at a glance"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitry Mandrika" }]
keywords = [
    "address poisoning",
    "blockchain",
    "fingerprint",
    "identicon",
    "visual hash",
    "wallet",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/censync/hh-python"
Documentation = "https://github.com/censync/hh-python/blob/main/docs/INTEGRATION.md"
Specification = "https://github.com/censync/hh-cpp/blob/v1.0.0/docs/SPEC.md"
Changelog = "https://github.com/censync/hh-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/censync/hh-python/issues"

[project.scripts]
humanized-hash = "humanized_hash._cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["humanized_hash"]
include-package-data = false

[tool.setuptools.package-data]
humanized_hash = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "humanized_hash._version.__version__" }
